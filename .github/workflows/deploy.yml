
name: Deploy Xinsheng to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
        run: npm run build

      - name: Prepare deployment package
        run: |
          tar \
            --exclude='./node_modules' \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.next/cache' \
            --exclude='./.env*' \
            -czf "$RUNNER_TEMP/xinsheng.tar.gz" .

      - name: Configure SSH
        env:
          SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -e

          RELEASE_ID="$GITHUB_SHA"
          RELEASE_DIR="/var/www/xinsheng/releases/$RELEASE_ID"

          ssh -i ~/.ssh/deploy_key \
            "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$RELEASE_DIR'"

          scp -i ~/.ssh/deploy_key \
            "$RUNNER_TEMP/xinsheng.tar.gz" \
            "$VPS_USER@$VPS_HOST:$RELEASE_DIR/"

          ssh -i ~/.ssh/deploy_key \
            "$VPS_USER@$VPS_HOST" \
            "set -e
             cd '$RELEASE_DIR'
             tar -xzf xinsheng.tar.gz
             rm xinsheng.tar.gz

             /root/.nvm/versions/node/v22.23.2/bin/npm ci --omit=dev

             ln -sfn '$RELEASE_DIR' /var/www/xinsheng/current

             /usr/bin/pm2 startOrReload /var/www/xinsheng/ecosystem.config.cjs --update-env
            "

      - name: Health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$VPS_USER@$VPS_HOST" \
            "for i in \$(seq 1 30); do
               if curl -fsS http://127.0.0.1:3005 > /dev/null; then
                 echo 'Xinsheng is running!'
                 /usr/bin/pm2 save
                 exit 0
               fi
               sleep 2
             done
             echo 'Xinsheng health check failed'
             exit 1"
